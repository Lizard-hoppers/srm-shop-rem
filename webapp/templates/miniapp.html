<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Сервис-центр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .boot-box { text-align: center; }
  .boot-logo {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
  }
  .boot-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .boot-status { color: var(--muted); font-size: 13.5px; margin: 14px 0 4px; }
  .spinner {
    width: 22px; height: 22px; margin: 4px auto 0;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="boot-box">
  <div class="boot-logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
  </div>
  <div class="boot-title">CRM Сервис-центр</div>
  {% if error %}
  <div class="flash flash-error">{{ error }}</div>
  {% else %}
  <div class="boot-status" id="status">Подключаемся через Telegram…</div>
  <div class="spinner" id="spinner"></div>
  {% endif %}
</div>
<form id="autoForm" method="post" action="/miniapp/auto" style="display:none">
  <input type="hidden" name="initData" id="initDataField">
</form>
<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : "";
const statusEl = document.getElementById("status");
const spinnerEl = document.getElementById("spinner");

if (!initData) {
  if (statusEl) statusEl.textContent = "Откройте это приложение через кнопку бота в Telegram.";
  if (spinnerEl) spinnerEl.style.display = "none";
} else {
  document.getElementById("initDataField").value = initData;
  document.getElementById("autoForm").submit();
}
</script>
</body>
</html>
